[package]
name = "skillet"
version = "0.1.0"
description = "A desktop atelier for your Claude Code setup: every skill and MCP server at a glance"
authors = ["offbyone1"]
license = "MIT"
repository = "https://github.com/offbyone1/skillet"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "skillet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
